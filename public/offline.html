<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
           background: #0a0807; color: #f4f0ec; font-family: -apple-system, system-ui, sans-serif; padding: 2rem; }
    h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
    p { color: #a09890; font-size: .95rem; margin: 0 0 1.5rem; }
    button { background: linear-gradient(135deg, #FF7035, #FF9F00); color: #0a0807; border: 0; border-radius: 14px;
             padding: .85rem 1.6rem; font-size: 1rem; font-weight: 700; }
  </style>
</head>
<body>
  <div>
    <h1>You are offline</h1>
    <p>Check your internet connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
